version: "3.9"

services:
  app:
    build: .
    container_name: stock-intelligence-rag
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
      - LANGFUSE_ENVIRONMENT=${LANGFUSE_ENVIRONMENT}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stock-net

  refresher:
    build: .
    container_name: stock-data-refresher
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: python -m src.ingestion.refresh
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - stock-net

networks:
  stock-net:
    driver: bridge
